name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docqa_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      UPLOAD_DIR: uploads
      MAX_PDF_PAGES: 20
      MAX_UPLOAD_MB: 10
      MAX_DOCS_PER_USER: 5
      EMBEDDING_DIMENSIONS: 768
      GEMINI_API_KEY: test-key
      TEST_USER_EMAIL: ci-user@example.com
      TEST_USER_PASSWORD: CiPassword123!

    services:
      postgres:
        image: pgvector/pgvector:pg16  
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies, typecheck and build
        run: |
            npm ci
            npm run typecheck
            npm run build  

      - name: Run migrations
        run: npm run db:migrate
            
      - name: Run Playwright API tests
        run: npx playwright test

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docqa-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docqa-api:${{ github.sha }}

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"